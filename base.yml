services:
  web:
    build:
      context: app
      dockerfile: Dockerfile
      args:
        SKOPE_BUILD_ID: ${SKOPE_BUILD_ID:-development}
    environment:
      NUXT_PUBLIC_SENTRY_DSN: "${NUXT_PUBLIC_SENTRY_DSN-https://9b9dc2f60562380edeb675c39fe1c896@sentry.comses.net/4}"
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8001}
      NUXT_PUBLIC_CARTO_API_KEY: ${NUXT_PUBLIC_CARTO_API_KEY:-}
      NUXT_PUBLIC_STADIA_API_KEY: ${NUXT_PUBLIC_STADIA_API_KEY:-}
      NUXT_PUBLIC_STADIA_DOMAIN_AUTH: ${NUXT_PUBLIC_STADIA_DOMAIN_AUTH:-true}
    restart: always
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(3000, '127.0.0.1').on('connect', function () { process.exit(0) }).on('error', function () { process.exit(1) })"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
